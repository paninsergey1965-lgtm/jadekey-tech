<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Проверка уведомления</title>
<style>body{font:17px/1.5 -apple-system,sans-serif;padding:24px;max-width:520px;margin:auto}input,button{font:inherit;width:100%;padding:14px;margin-top:10px;box-sizing:border-box}button{background:#141414;color:#fff;border:0}#r{margin-top:18px;white-space:pre-wrap}</style></head><body>
<h2>Проверка уведомления в Telegram</h2>
<p>Вставьте ID платежа из ЮKassa (Платежи → платёж на 100 ₽ → идентификатор).</p>
<input id="id" placeholder="например 2f3c…-000f-5000-…"><button id="go">Проверить</button><div id="r"></div>
<script>
document.getElementById('go').onclick=async()=>{const id=document.getElementById('id').value.trim(),r=document.getElementById('r');if(!id){r.textContent='Вставьте ID';return}r.textContent='Отправляю…';
try{const x=await fetch('https://functions.yandexcloud.net/d4eif8g25o2652dmff0v',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'payment.succeeded',object:{id}})});r.textContent='Ответ сервера: '+x.status+' '+(await x.text())+'\n\nТеперь посмотрите, пришло ли сообщение в Telegram.'}catch(e){r.textContent='Ошибка связи с сервером: '+e.message}};
</script></body></html>
