name: JADEKEY Love daily card
on:
  schedule:
    - cron: '17 5,16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/love-day.yml']
permissions:
  contents: write
  id-token: write
concurrency:
  group: jadekey-love-calendar
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python love-days/prepare.py
        env:
          LOVE_FIRST_COLLECTION: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Подготовить первые 20 иллюстрированных карточек Любви' }}
      - name: Publish saved card
        if: ${{ !cancelled() }}
        run: |
          git add love-days/calendar.json love-days/cards
          if git diff --staged --quiet; then exit 0; fi
          git config user.name 'JADEKEY Calendar'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Добавить ежедневную карточку Любовь'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
